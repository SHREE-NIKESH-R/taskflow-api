# Application
spring.application.name=taskflow-api
server.port=8080
 
# Database (replace with your Railway values)
spring.datasource.url=jdbc:mysql://HOST:PORT/railway?useSSL=true
spring.datasource.username=YOUR_MYSQL_USERNAME
spring.datasource.password=YOUR_MYSQL_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
 
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
 
# JWT
jwt.secret=taskflow_super_secret_key_change_in_production_2024
jwt.expiration=86400000
 

